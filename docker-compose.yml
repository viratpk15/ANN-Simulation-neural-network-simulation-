# Optional convenience. The app needs NO containers to run — see README for
# plain local setup. This compose just wraps the two commands.
services:
  backend:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - neurosim-data:/app/data
    environment:
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      # Optional LLM — app works without any of these:
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-groq,openrouter,ollama}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}

  frontend:
    build:
      context: .
      dockerfile: scripts/Dockerfile.frontend
      args:
        VITE_API_BASE: ""
    ports:
      - "3000:80"     # serves the built SPA; /api + /ws proxied to backend
    depends_on:
      - backend

volumes:
  neurosim-data:
